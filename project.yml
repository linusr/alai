name: Alai
options:
  bundleIdPrefix: me.4vr
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Your 10-character Apple Developer team ID; required for push, app groups and device builds
    DEVELOPMENT_TEAM: 2NDDPG5773
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_BUNDLE_ID: me.4vr.alai
    APP_GROUP: group.me.4vr.alai
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      PUSH_ENVIRONMENT: sandbox
      APS_ENVIRONMENT: development
    Release:
      PUSH_ENVIRONMENT: production
      APS_ENVIRONMENT: production

packages:
  NtfyKit:
    path: Packages/NtfyKit

targets:
  Alai:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: NtfyKit
      - target: NotificationService
      - target: Widgets
      - target: AlaiWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Alai
        # Only standard HTTPS, which is exempt from export compliance documentation
        ITSAppUsesNonExemptEncryption: false
        NtfyAppGroup: $(APP_GROUP)
        NtfyPushEnvironment: $(PUSH_ENVIRONMENT)
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(APP_BUNDLE_ID).refresh]
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [alai]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/Alai.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups: [$(APP_GROUP)]
        com.apple.developer.usernotifications.time-sensitive: true

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
    dependencies:
      - package: NtfyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).NotificationService
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Alai Notifications
        NtfyAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]

  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    dependencies:
      - package: NtfyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Alai Widgets
        NtfyAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]

  AlaiWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
    dependencies:
      - package: NtfyKit
      - target: WatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: Alai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Watch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Alai
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        ITSAppUsesNonExemptEncryption: false
        NtfyAppGroup: $(APP_GROUP)
    entitlements:
      path: Watch/AlaiWatch.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]

  WatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidgets
    dependencies:
      - package: NtfyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp.Widgets
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Alai Complications
        NtfyAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidgets/WatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]

schemes:
  Alai:
    build:
      targets:
        Alai: all
    test:
      targets:
        - package: NtfyKit/NtfyKitTests
